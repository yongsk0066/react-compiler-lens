name: Bug Report
description: Report a bug in React Compiler Lens
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check if an existing issue covers your problem.

  - type: input
    id: vscode-version
    attributes:
      label: VS Code Version
      placeholder: "e.g. 1.90.0"
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension Version
      placeholder: "e.g. 0.0.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. macOS 14.5, Windows 11, Ubuntu 22.04"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open a file with ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Logs, screenshots, or minimal reproduction if available.
